        let gameState = {
            screen: 'start',
            blueScore: 0,
            redScore: 0,
            bluePosition: 0,
            redPosition: 100,
            blueQuestionIndex: 0,
            redQuestionIndex: 0,
            usedQuestionsBlue: [],
            usedQuestionsRed: [],
            blueAnswerRevealed: false,
            redAnswerRevealed: false,
            winner: null,
            waitingForNext: false
        };

        function getRandomQuestion(team) {
            const usedQuestions = team === 'blue' ? gameState.usedQuestionsBlue : gameState.usedQuestionsRed;
            const availableIndices = questions
                .map((_, i) => i)
                .filter(i => !usedQuestions.includes(i));
            
            if (availableIndices.length === 0) {
                if (team === 'blue') {
                    gameState.usedQuestionsBlue = [];
                } else {
                    gameState.usedQuestionsRed = [];
                }
                return Math.floor(Math.random() * questions.length);
            }
            
            const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            
            if (team === 'blue') {
                gameState.usedQuestionsBlue.push(randomIndex);
            } else {
                gameState.usedQuestionsRed.push(randomIndex);
            }
            
            return randomIndex;
        }

        function createConfetti() {
            const colors = ['#3b82f6', '#ef4444', '#22c55e', '#fbbf24', '#a855f7', '#06b6d4'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function startGame() {
            gameState = {
                screen: 'game',
                blueScore: 0,
                redScore: 0,
                bluePosition: 0,
                redPosition: 100,
                blueQuestionIndex: getRandomQuestion('blue'),
                redQuestionIndex: getRandomQuestion('red'),
                usedQuestionsBlue: [],
                usedQuestionsRed: [],
                blueAnswerRevealed: false,
                redAnswerRevealed: false,
                winner: null,
                waitingForNext: false
            };
            render();
        }

        function selectAnswer(team, index) {
            if (gameState.waitingForNext) return;
            
            const isBlue = team === 'blue';
            const questionIndex = isBlue ? gameState.blueQuestionIndex : gameState.redQuestionIndex;
            const question = questions[questionIndex];
            const isCorrect = index === question.correct;
            
            if (isBlue && gameState.blueAnswerRevealed) return;
            if (!isBlue && gameState.redAnswerRevealed) return;
            
            if (isBlue) {
                gameState.blueAnswerRevealed = true;
            } else {
                gameState.redAnswerRevealed = true;
            }
            
            const selectedBtn = document.getElementById(`${team}-answer-${index}`);
            const correctBtn = document.getElementById(`${team}-answer-${question.correct}`);
            
            if (isCorrect) {
                selectedBtn.classList.add('correct-answer');
            } else {
                selectedBtn.classList.add('wrong-answer');
                correctBtn.classList.add('correct-answer');
            }
            
            const feedback = document.getElementById(`${team}-feedback`);
            if (isCorrect) {
                feedback.innerHTML = `<span class="text-green-400 font-bold">✅ Дұрыс!</span>`;
                if (isBlue) {
                    gameState.blueScore++;
                    gameState.bluePosition = Math.min(100, gameState.bluePosition + 10);
                } else {
                    gameState.redScore++;
                    gameState.redPosition = Math.max(0, gameState.redPosition - 10);
                }
            } else {
                feedback.innerHTML = `<span class="text-red-400 font-bold">��� Қате!</span>`;
                if (isBlue) {
                    gameState.bluePosition = Math.max(0, gameState.bluePosition - 5);
                } else {
                    gameState.redPosition = Math.min(100, gameState.redPosition + 5);
                }
            }
            
            // Check for winner and update questions
            setTimeout(() => {
                if (gameState.bluePosition >= 50) {
                    gameState.winner = 'blue';
                    gameState.screen = 'winner';
                    render();
                } else if (gameState.redPosition <= 50) {
                    gameState.winner = 'red';
                    gameState.screen = 'winner';
                    render();
                } else {
                    // Load new question for the team that just answered
                    if (isBlue) {
                        gameState.blueQuestionIndex = getRandomQuestion('blue');
                        gameState.blueAnswerRevealed = false;
                    } else {
                        gameState.redQuestionIndex = getRandomQuestion('red');
                        gameState.redAnswerRevealed = false;
                    }
                    render();
                }
            }, 800);
        }

        function restartGame() {
            startGame();
        }

        async function onConfigChange(newConfig) {
            config = { ...defaultConfig, ...newConfig };
            render();
        }

        function mapToCapabilities(cfg) {
            return {
                recolorables: [
                    {
                        get: () => cfg.background_color || defaultConfig.background_color,
                        set: (value) => {
                            config.background_color = value;
                            if (window.elementSdk) window.elementSdk.setConfig({ background_color: value });
                        }
                    },
                    {
                        get: () => cfg.surface_color || defaultConfig.surface_color,
                        set: (value) => {
                            config.surface_color = value;
                            if (window.elementSdk) window.elementSdk.setConfig({ surface_color: value });
                        }
                    },
                    {
                        get: () => cfg.text_color || defaultConfig.text_color,
                        set: (value) => {
                            config.text_color = value;
                            if (window.elementSdk) window.elementSdk.setConfig({ text_color: value });
                        }
                    },
                    {

                        set: (value) => {

                        }

                    {

                        set: (value) => {

                    }
                ],

                    set: (value) => {
                        config.font_family = value;
                        if (window.elementSdk) window.elementSdk.setConfig({ font_family: value });
                    }
                },
                fontSizeable: {
                    get: () => cfg.font_size || defaultConfig.font_size,
                    set: (value) => {
                        config.font_size = value;
                        if (window.elementSdk) window.elementSdk.setConfig({ font_size: value });
                    }
                }
            };
        }

        function mapToEditPanelValues(cfg) {
            return new Map([
                ["game_title", cfg.game_title || defaultConfig.game_title],
                ["blue_team_name", cfg.blue_team_name || defaultConfig.blue_team_name],
                ["red_team_name", cfg.red_team_name || defaultConfig.red_team_name]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        } else {
            render();
        }
    </script>
